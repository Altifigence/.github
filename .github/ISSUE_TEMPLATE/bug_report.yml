name: Bug report
description: Report a reproducible problem in this public project
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use Security → Report a vulnerability. Remove tokens, private designs and restricted files before sharing."
  - type: input
    id: versions
    attributes:
      label: Versions and environment
      description: Repository/package version, DDS version if applicable, OS and runtime
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps or a small example you are allowed to publish
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
